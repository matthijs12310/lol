name: "macOS Remote Desktop"

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Build Hub machine pool label"
        required: true
        default: "bitrise-runner-testing"
      minutes:
        description: "Minutes to stay alive"
        required: true
        default: "60"

jobs:
  desktop:
    runs-on: "${{ inputs.runner_label }}"
    timeout-minutes: 360
    steps:
      - name: "Create VNC user"
        env:
          VNC_PASSWORD: "${{ secrets.VNC_PASSWORD }}"
        run: |
          if ! id vncuser >/dev/null 2>&1; then
            sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "$VNC_PASSWORD" -admin
            sleep 5
          fi
          echo "vncuser ready"

      - name: "Enable Screen Sharing"
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users vncuser -privs -all -restart -agent
          echo "screen sharing enabled"

      - name: "Set VNC password"
        env:
          VNC_PASSWORD: "${{ secrets.VNC_PASSWORD }}"
        run: |
          printf '%s' "$VNC_PASSWORD" > /tmp/vncpw.txt
          perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" } open(F, "<", "/tmp/vncpw.txt"); my $pw = <F>; $pw = "" unless defined $pw; chomp $pw; $pw .= chr(0) x (8 - length $pw); foreach (unpack("C*", $pw)) { printf "%02X", $_ ^ (shift @k) } print chr(10);' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null
          sudo chmod 644 /Library/Preferences/com.apple.VNCSettings.txt
          rm -f /tmp/vncpw.txt
          echo "vnc password set"

      - name: "Start tunnel"
        env:
          NGROK_AUTHTOKEN: "${{ secrets.NGROK_AUTHTOKEN }}"
        run: |
          set -e
          if ! command -v ngrok >/dev/null 2>&1; then
            curl -sSL -o /tmp/ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip
            unzip -o -q /tmp/ngrok.zip -d /tmp
            sudo mv /tmp/ngrok /usr/local/bin/ngrok
          fi
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          nohup ngrok tcp 5900 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 10

      - name: "Connection details"
        run: |
          URL=$(curl -s http://127.0.0.1:4040/api/tunnels | python3 -c 'import sys,json; print(json.load(sys.stdin)["tunnels"][0]["public_url"])')
          echo "========================================="
          echo "connect to: vnc://vncuser@${URL#tcp://}"
          echo "username: vncuser"
          echo "========================================="

      - name: "Keep alive"
        env:
          MINUTES: "${{ inputs.minutes }}"
        run: |
          for i in $(seq 1 $(( MINUTES * 6 ))); do
            if [ -f /tmp/done ]; then echo "released"; exit 0; fi
            sleep 10
          done
